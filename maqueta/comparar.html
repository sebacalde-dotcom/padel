<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estilos gráficos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=block" rel="stylesheet">
<style>
  body { margin: 0; padding: 26px 28px 30px; background: #0a0f1e; color: #fff; font-family: 'Barlow Condensed', sans-serif;
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px 22px; }
  figure { margin: 0; }
  figcaption { font-size: 31px; font-weight: 700; margin: 0 0 9px; }
  figcaption span { margin-left: 10px; font-size: 25px; font-weight: 600; opacity: .6; }
  img { display: block; width: 100%; border-radius: 14px; }
</style>
</head>
<body>
  <figure><figcaption>1 · Realista low-poly <span>el de la primera imagen</span></figcaption><img src="estilos/realista.png"></figure>
  <figure><figcaption>2 · Caricatura <span>tonos planos con contorno</span></figcaption><img src="estilos/caricatura.png"></figure>
  <figure><figcaption>3 · Pixel art <span>retro, tipo 16 bits</span></figcaption><img src="estilos/pixel.png"></figure>
  <figure><figcaption>4 · Plano <span>vectorial, sin luces ni sombras</span></figcaption><img src="estilos/plano.png"></figure>
</body>
</html>
